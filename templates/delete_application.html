<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Application - CareerTrack</title>

</head>


<body>

    <h1>Delete Application</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <h2>
        {{ application.company_name }}
        -
        {{ application.job_title }}
    </h2>


    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'home' %}">
            Cancel
        </a>

    </form>

</body>

</html>
