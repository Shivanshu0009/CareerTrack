<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CareerTrack</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;

            color: #2563eb;
            font-size: 30px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .help {
            font-size: 13px;
            color: #64748b;
            margin-top: -10px;
            margin-bottom: 18px;
        }

        .errors {
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 10px;
        }

    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            CareerTrack
        </div>

        <p class="subtitle">
            Create your account
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.username.id_for_label }}">
                Username
            </label>

            {{ form.username }}

            <div class="help">
                Choose a unique username.
            </div>

            {{ form.username.errors }}

            <label for="{{ form.password1.id_for_label }}">
                Password
            </label>

            {{ form.password1 }}

            {{ form.password1.errors }}

            <label for="{{ form.password2.id_for_label }}">
                Confirm Password
            </label>

            {{ form.password2 }}

            {{ form.password2.errors }}

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="/login/">Login</a>
        </div>

    </div>

</body>

</html>
